<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxbox board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/boxbox.css">
<script src="assets/boxbox.js"></script>
</head>
<body>
<!-- This page is fixed. Never edit it by hand or by agent.
     It draws itself from board-data.js, which the agent rewrites after every step. -->
<div class="main">
  <header class="pagebar">
    <nav class="crumbs" aria-label="Breadcrumbs"><span class="brandlink">boxbox</span><a class="pitlink" href="/">Pit wall</a><span aria-current="page">Board</span></nav>
    <div class="theme" role="radiogroup" aria-label="Colour theme"><button type="button" role="radio" data-theme-set="auto" aria-checked="true">Auto</button><button type="button" role="radio" data-theme-set="light" aria-checked="false">Light</button><button type="button" role="radio" data-theme-set="dark" aria-checked="false">Dark</button></div>
  </header>
  <div class="yourmove" id="waiting" hidden></div>
  <main class="wall">
    <div class="wall-head"><h1 id="project">Board</h1><p id="lede">The whole project in one place.</p></div>
    <dl class="metrics" id="tiles"></dl>
    <div class="boardbar">
      <button type="button" id="openall">Expand all</button>
      <button type="button" id="closeall">Collapse all</button>
      <div class="legend" id="legend"></div>
    </div>
    <div id="tree"></div>
    <section id="knowledge"></section>
    <p class="note" id="foot">Read-only. To change the plan, tell the agent.</p>
  </main>
</div>

<script src="board-data.js"></script>
<script>
(function () {
  "use strict";
  var B = window.BOXBOX_BOARD;
  // status -> [colour, word]
  var ST = {
    todo: ["", "to do"], in_progress: ["live", "in progress"], review: ["move", "your review"], changes: ["move", "changes asked"],
    done: ["done", "done"], skipped: ["", "skipped"], blocked: ["flag", "blocked"]
  };
  var CLOSED = { done: 1, skipped: 1 };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeHref(h) {
    if (typeof h !== "string" || !h) return null;
    if (/^https?:\/\//i.test(h)) return h;
    if (/^[a-z][a-z0-9+.-]*:/i.test(h)) return null;
    return h;
  }
  function link(label, href) {
    var h = safeHref(href);
    if (!h) return null;
    var a = el("a", "pagelink", label);
    a.href = h;
    if (/^https?:/i.test(h)) { a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }
  function status(s) {
    var k = ST[s] ? s : "todo";
    var n = el("span", "status", ST[k][1]);
    if (ST[k][0]) n.setAttribute("data-st", ST[k][0]);
    return n;
  }
  function linksRow(items) {
    var row = el("nav", "pagelinks");
    row.setAttribute("aria-label", "Pages");
    (items || []).forEach(function (l) { var a = link(l.label, l.href); if (a) row.appendChild(a); });
    return row.childNodes.length ? row : null;
  }
  function countTasks(epic) {
    var t = epic.tasks || [];
    return { total: t.length, done: t.filter(function (x) { return CLOSED[x.status]; }).length };
  }
  var tree = document.getElementById("tree");

  if (!B || !Array.isArray(B.milestones)) { tree.appendChild(el("p", "empty", "No board data yet. It appears after the first plan is written.")); return; }
  if (!B.milestones.length) tree.appendChild(el("p", "empty", "Nothing planned yet. Tell the agent what you want to build."));

  document.title = (B.project || "Project") + " · Boxbox board";
  document.getElementById("project").textContent = B.project || "Board";
  var lede = [];
  if (B.goal) lede.push(B.goal);
  if (B.unit) lede.push("Unit of control: " + B.unit + ".");
  if (B.decisionLevel) lede.push("Decisions: " + B.decisionLevel + ".");
  if (B.updated) lede.push("Updated " + B.updated + ".");
  if (lede.length) document.getElementById("lede").textContent = lede.join(" ");

  // what is waiting for the developer
  if (B.waiting && B.waiting.what) {
    var w = document.getElementById("waiting");
    w.appendChild(el("b", null, "Your move"));
    var span = el("span", null, B.waiting.what);
    if (B.waiting.detail) span.appendChild(el("small", null, B.waiting.detail));
    w.appendChild(span);
    var h = safeHref(B.waiting.href);
    if (h) { var go = el("a", null, B.waiting.label || "Open"); go.href = h; var em = el("em"); em.appendChild(go); w.appendChild(em); }
    w.hidden = false;
  }

  // totals
  var eTotal = 0, eDone = 0, tTotal = 0, tDone = 0, mDone = 0;
  B.milestones.forEach(function (m) {
    if (CLOSED[m.status]) mDone++;
    (m.epics || []).forEach(function (e) { eTotal++; if (CLOSED[e.status]) eDone++; var c = countTasks(e); tTotal += c.total; tDone += c.done; });
  });
  var tiles = document.getElementById("tiles");
  [["milestones done", mDone, B.milestones.length], ["epics done", eDone, eTotal], ["tasks done", tDone, tTotal]].forEach(function (t) {
    var d = el("div"), dt = el("dt", null, t[0]), dd = el("dd", "metric", String(t[1]));
    dd.appendChild(el("small", null, "/" + t[2]));
    d.appendChild(dt); d.appendChild(dd); tiles.appendChild(d);
  });

  var legend = document.getElementById("legend");
  ["todo", "in_progress", "review", "done", "blocked"].forEach(function (s) { legend.appendChild(status(s)); });

  // milestones, newest first
  B.milestones.slice().reverse().forEach(function (m) {
    var md = el("details", "milestone");
    md.open = B.milestones.length === 1 || !CLOSED[m.status];
    var head = el("summary", "mhead");
    var h2 = el("h2");
    if (m.id) h2.appendChild(el("data", null, m.id));
    h2.appendChild(document.createTextNode(m.title || "Milestone"));
    head.appendChild(h2);
    head.appendChild(status(m.status));
    var epics = m.epics || [];
    head.appendChild(el("span", "count", epics.filter(function (e) { return CLOSED[e.status]; }).length + " of " + epics.length + " epics done"));
    var ml = linksRow(m.links); if (ml) head.appendChild(ml);
    if (m.goal) head.appendChild(el("p", null, m.goal));
    md.appendChild(head);

    var grid = el("div", "epics");
    epics.forEach(function (e) {
      var card = el("div", "ep");
      var h3 = el("h3");
      if (e.id) h3.appendChild(el("data", null, e.id));
      h3.appendChild(document.createTextNode(e.title || "Epic"));
      card.appendChild(h3);
      var marks = el("div", "marks");
      marks.appendChild(status(e.status));
      var c = countTasks(e);
      marks.appendChild(el("span", "count", c.done + " of " + c.total + " tasks"));
      card.appendChild(marks);
      if (e.outcome) card.appendChild(el("p", null, e.outcome));
      var meta = el("div", "meta");
      if (e.branch) { meta.appendChild(document.createTextNode("branch ")); meta.appendChild(el("code", null, e.branch)); }
      if (e.depends) meta.appendChild(el("span", null, "needs " + e.depends));
      if (meta.childNodes.length) card.appendChild(meta);
      var items = (e.links || []).slice();
      if (e.pr) items.push({ label: "Pull request", href: e.pr });
      var elk = linksRow(items); if (elk) card.appendChild(elk);
      var rows = el("ul", "tasklist");
      (e.tasks || []).forEach(function (t) {
        var li = el("li");
        var k = ST[t.status] ? t.status : "todo";
        if (ST[k][0]) li.setAttribute("data-st", ST[k][0]);
        if (k === "skipped") li.setAttribute("data-st", "skipped");
        li.appendChild(el("data", null, t.id || ""));
        var mid = el("span", null, t.title || "");
        if (t.test) mid.appendChild(el("small", null, "First test: " + t.test));
        li.appendChild(mid);
        li.appendChild(t.commit ? el("span", "commit", t.commit) : el("span"));
        rows.appendChild(li);
      });
      if (rows.childNodes.length) card.appendChild(rows);
      grid.appendChild(card);
    });
    md.appendChild(grid);
    tree.appendChild(md);
  });

  // knowledge pages
  if (Array.isArray(B.knowledge) && B.knowledge.length) {
    var k = document.getElementById("knowledge");
    k.appendChild(el("h2", "colhead", "Knowledge pages"));
    var kl = linksRow(B.knowledge.map(function (x) { return { label: x.title, href: x.href }; }));
    if (kl) k.appendChild(kl);
  }

  function setAll(open) { tree.querySelectorAll("details").forEach(function (d) { d.open = open; }); }
  document.getElementById("openall").addEventListener("click", function () { setAll(true); });
  document.getElementById("closeall").addEventListener("click", function () { setAll(false); });
})();
</script>
</body>
</html>
